name: 同步日报数据

on:
  schedule:
    # 每天北京时间 7:37 运行（UTC 23:37）
    # 选 :37 避开整点常用分钟数（0/15/30/45）减轻排队延迟
    - cron: '37 23 * * *'
  workflow_dispatch:  # 支持手动触发（方便测试）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          YZJ_ACCOUNT: ${{ secrets.YZJ_ACCOUNT }}
          YZJ_PASSWORD: ${{ secrets.YZJ_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node scripts/sync-daily-report.js
